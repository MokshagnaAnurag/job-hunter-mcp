<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Tracker — Job Hunter</title>
  <meta name="description" content="Track all job applications with status updates and audit trails">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div>
        <h1>📊 Application Tracker</h1>
        <p class="subtitle">Track every application and its status</p>
      </div>
      <button class="btn btn-primary btn-sm" onclick="callTool('monitor-applications', {})">Check Updates</button>
    </header>

    <!-- Tabs -->
    <div class="tabs" id="status-tabs">
      <button class="tab active" onclick="filterByStatus('ALL')">All</button>
      <button class="tab" onclick="filterByStatus('APPLIED')">Applied</button>
      <button class="tab" onclick="filterByStatus('SHORTLISTED')">Shortlisted</button>
      <button class="tab" onclick="filterByStatus('INTERVIEW_INVITED')">Interviews</button>
      <button class="tab" onclick="filterByStatus('ASSESSMENT')">Assessment</button>
      <button class="tab" onclick="filterByStatus('OFFER')">Offers</button>
      <button class="tab" onclick="filterByStatus('REJECTED')">Rejected</button>
    </div>

    <!-- Applications Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Company</th>
            <th>Role</th>
            <th>Source</th>
            <th>Status</th>
            <th>Applied</th>
            <th>Last Updated</th>
            <th>Next Action</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="applications-tbody">
          <tr>
            <td colspan="8" class="text-muted" style="text-align:center; padding:48px;">
              No applications yet. Search for jobs and start applying!
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Quick Stats -->
    <div class="grid grid-4 mt-4 stagger">
      <div class="stat-card animate-fade-in">
        <div class="stat-icon blue">📬</div>
        <div>
          <div class="stat-value" id="total-applied">0</div>
          <div class="stat-label">Total Applied</div>
        </div>
      </div>
      <div class="stat-card animate-fade-in">
        <div class="stat-icon purple">⏳</div>
        <div>
          <div class="stat-value" id="total-pending">0</div>
          <div class="stat-label">Awaiting Response</div>
        </div>
      </div>
      <div class="stat-card animate-fade-in">
        <div class="stat-icon green">✅</div>
        <div>
          <div class="stat-value" id="total-positive">0</div>
          <div class="stat-label">Positive Response</div>
        </div>
      </div>
      <div class="stat-card animate-fade-in">
        <div class="stat-icon red">❌</div>
        <div>
          <div class="stat-value" id="total-rejected">0</div>
          <div class="stat-label">Rejected</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentFilter = 'ALL';

    function sendMcpMessage(method, params) {
      window.parent.postMessage({ jsonrpc: '2.0', method, params, id: Date.now() }, '*');
    }
    function callTool(name, params) {
      sendMcpMessage('tools/call', { name, arguments: params });
    }

    function filterByStatus(status) {
      currentFilter = status;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');

      if (status === 'ALL') {
        callTool('list-applications', { limit: 100 });
      } else {
        callTool('list-applications', { status, limit: 100 });
      }
    }

    function getStatusBadge(status) {
      const map = {
        'DISCOVERED': 'discovered', 'APPLIED': 'applied', 'SHORTLISTED': 'shortlisted',
        'INTERVIEW_INVITED': 'interview', 'INTERVIEW_SCHEDULED': 'interview',
        'REJECTED': 'rejected', 'OFFER': 'offer', 'MANUAL_ACTION_REQUIRED': 'manual',
        'READY_TO_APPLY': 'pending', 'ASSESSMENT': 'pending',
      };
      return `<span class="badge ${map[status] || 'discovered'}">${status.replace(/_/g, ' ')}</span>`;
    }

    function renderApplications(apps) {
      const tbody = document.getElementById('applications-tbody');
      if (!apps || apps.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-muted" style="text-align:center;padding:48px;">No applications found for this filter.</td></tr>';
        return;
      }

      tbody.innerHTML = apps.map(a => `
        <tr>
          <td><strong>${a.company}</strong></td>
          <td>${a.role}</td>
          <td><span class="job-tag">${a.source}</span></td>
          <td>${getStatusBadge(a.status)}</td>
          <td class="text-sm text-muted">${a.date_applied ? new Date(a.date_applied).toLocaleDateString('en-IN') : '—'}</td>
          <td class="text-sm text-muted">${new Date(a.updated_at).toLocaleDateString('en-IN')}</td>
          <td class="text-sm">${a.next_action || '—'}</td>
          <td>
            <div class="flex gap-2">
              <button class="btn btn-ghost btn-sm" onclick="callTool('get-application', {applicationId:'${a.id}'})">Details</button>
              ${a.status === 'READY_TO_APPLY' ? `<button class="btn btn-primary btn-sm" onclick="callTool('apply-to-job', {applicationId:'${a.id}', confirmed:true})">Apply</button>` : ''}
            </div>
          </td>
        </tr>
      `).join('');
    }

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (data?.result) console.log('Response:', data);
    });
  </script>
</body>
</html>
